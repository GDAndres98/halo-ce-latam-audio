<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M4 Dialogue Matching</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2329; --muted: #66707a; --line: #dde1e6;
  --accent: #2f6fde; --accent-ink: #ffffff; --ok: #1f8a4c; --warn: #b26b00; --bad: #c0392b;
  --chip: #eef2f8; --sel: #e3ecfb; --code: #f0f2f5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181c; --panel: #1d2126; --ink: #e6e9ec; --muted: #9aa4ae; --line: #2e343b;
    --accent: #6c9cf0; --accent-ink: #0d1117; --ok: #49c27c; --warn: #e0a345; --bad: #ef6f62;
    --chip: #262c34; --sel: #23324a; --code: #262b31;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
select, input, textarea, button { font: inherit; color: inherit; }
select, input[type=search], input[type=text], textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
button { background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.play { padding: 2px 7px; }
.bar { flex: 1 1 200px; min-width: 160px; height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
code, .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
main { display: grid; grid-template-columns: minmax(240px, 22%) minmax(360px, 1fr) minmax(320px, 34%); gap: 0; height: calc(100vh - 92px); }
section.col { overflow: auto; border-right: 1px solid var(--line); padding: 10px 12px; }
section.col:last-child { border-right: 0; }
.col h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
.tools { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.tools > * { flex: 1 1 auto; }
ul.list { list-style: none; margin: 0; padding: 0; }
ul.list li { padding: 5px 6px; border-radius: 6px; cursor: pointer; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
ul.list li .snip { flex-basis: 100%; padding-left: 15px; }
ul.list li:hover { background: var(--chip); }
ul.list li.sel { background: var(--sel); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; border: 1.5px solid var(--muted); }
.dot.matched { background: var(--ok); border-color: var(--ok); }
.dot.no_equivalent { background: var(--muted); border-color: var(--muted); }
.dot.deferred { background: var(--warn); border-color: var(--warn); }
.badge { font-size: 11px; padding: 0 5px; border-radius: 4px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.badge.approved { background: var(--ok); color: var(--accent-ink); }
.badge.needs_rework { background: var(--bad); color: #fff; }
.badge.draft { background: var(--chip); }
.grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
.card h3 { margin: 0 0 6px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
.text { background: var(--code); border-radius: 6px; padding: 5px 8px; margin: 3px 0; white-space: pre-wrap; word-break: break-word; }
.text b { color: var(--muted); font-weight: 600; margin-right: 6px; font-size: 12px; }
.chip { display: flex; gap: 6px; align-items: center; background: var(--chip); border-radius: 6px; padding: 4px 6px; margin: 4px 0; }
.cand { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; margin-bottom: 7px; background: var(--panel); }
.cand.chosen { border-color: var(--ok); }
.cand .head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.cand .num { font-size: 11px; color: var(--muted); width: 16px; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
label.opt { display: inline-flex; gap: 4px; align-items: center; margin-right: 10px; }
textarea { width: 100%; min-height: 54px; }
#msg { position: fixed; right: 16px; bottom: 16px; max-width: 520px; padding: 9px 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 4px 18px rgba(0,0,0,.18); display: none; white-space: pre-wrap; z-index: 5; }
#msg.err { border-color: var(--bad); }
#msg.ok { border-color: var(--ok); }
footer { height: 30px; padding: 5px 16px; border-top: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted); display: flex; gap: 16px; overflow: hidden; white-space: nowrap; }
.disabled-section { opacity: .65; pointer-events: none; }
mark { background: #ffe58a; color: #1d2329; border-radius: 2px; padding: 0 1px; }
.snip { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nosub { border: 1px dashed var(--warn); color: var(--warn); border-radius: 6px; padding: 4px 8px; margin: 3px 0; font-size: 12px; }
.badge.radio { background: #7a4fd6; color: #fff; }
.badge.fits { background: #1f7a8c; color: #fff; }
.badge.warn { background: var(--warn); color: var(--accent-ink); }
.kbd { font-family: ui-monospace, Consolas, monospace; font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.badge.edited { background: #b5651d; color: #fff; }
#editorBox { margin-top: 8px; }
.ed { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); }
.ed canvas { display: block; width: 100%; border-radius: 5px; }
.ed canvas.src { height: 112px; cursor: crosshair; }
.ed canvas.cmp { height: 46px; }
.ed .lbl { font-size: 11px; color: var(--muted); margin: 6px 0 2px; display: flex; justify-content: space-between; gap: 8px; }
.ed input[type=number] { width: 72px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; }
.ed input[type=range] { width: 140px; vertical-align: middle; }
.ed .grp { display: inline-flex; gap: 5px; align-items: center; margin-right: 12px; white-space: nowrap; }
.ed .stats { font-size: 12px; background: var(--code); border-radius: 6px; padding: 5px 8px; margin-top: 6px; }
.ed .warnline { color: var(--warn); font-size: 12px; }
.ed .cutchip { display: inline-flex; gap: 4px; align-items: center; background: var(--chip); border-radius: 5px; padding: 1px 6px; margin: 2px 4px 2px 0; font-size: 12px; }
.ed.locked .ctl { opacity: .55; }
.ed .stale { opacity: .45; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; height: auto; }
  section.col { border-right: 0; border-bottom: 1px solid var(--line); max-height: none; }
}
</style>
</head>
<body>
<header>
  <h1>M4 · Dialogue matching</h1>
  <label>Level <select id="level"></select></label>
  <div class="bar" id="pbar" title="decided / audio approved / subtitle approved"></div>
  <span id="ptext" class="small muted"></span>
  <label class="small">Level status
    <select id="lstatus">
      <option value="">— not set —</option>
      <option value="in_progress">in progress</option>
      <option value="ready_for_build">ready for build</option>
      <option value="in_game_tested">tested in MCC</option>
      <option value="reviewed">reviewed</option>
    </select></label>
  <button id="lstatusSave">Set</button>
  <span class="small muted"><span class="kbd">J</span>/<span class="kbd">K</span> slot · <span class="kbd">Space</span> Spain · <span class="kbd">1</span>–<span class="kbd">9</span> candidate · <span class="kbd">O</span>/<span class="kbd">E</span> original/edited · <span class="kbd">Esc</span> stop</span>
</header>
<main>
  <section class="col" id="colSlots">
    <h2>MCC slots</h2>
    <div class="tools">
      <select id="sfilter">
        <option value="">all</option>
        <option value="undecided">undecided</option>
        <option value="matched">matched</option>
        <option value="no_equivalent">no equivalent</option>
        <option value="deferred">deferred</option>
        <option value="audio_pending">audio not approved</option>
        <option value="subtitle_pending">subtitle not approved</option>
        <option value="needs_rework">needs rework</option>
        <option value="radio">needs radio effect</option>
        <option value="fits">different but fits</option>
        <option value="edited">audio edited</option>
        <option value="stereo">stereo</option>
      </select>
      <input type="search" id="sq" placeholder='search SU / SP / EN text, tag, speaker; "a phrase"'>
    </div>
    <label class="small"><input type="checkbox" id="sall"> search every level</label>
    <div class="small muted" id="scount"></div>
    <ul class="list" id="slots"></ul>
  </section>
  <section class="col" id="colDetail">
    <h2>Slot</h2>
    <div id="detail" class="muted">Pick a slot on the left.</div>
  </section>
  <section class="col" id="colCe">
    <h2>Campaign Evolved lines</h2>
    <div class="tools">
      <select id="cscope"></select>
      <select id="csubs" title="filter by es-MX source subtitle">
        <option value="">any subtitle</option>
        <option value="missing">no es-MX subtitle</option>
        <option value="present">has es-MX subtitle</option>
      </select>
      <input type="search" id="cq" placeholder='search es-MX / en / es-ES text, id, speaker; "a phrase"'>
    </div>
    <label class="small" title="Hide CE lines already listed in another slot's match (any level). The current slot's own lines stay visible.">
      <input type="checkbox" id="chide"> hide lines already used</label>
    <div class="small muted" id="ccount"></div>
    <div id="cands"></div>
    <button id="cmore" style="display:none">Load more</button>
  </section>
</main>
<footer id="foot">validator: not run yet</footer>
<div id="msg"></div>
<audio id="player" preload="none"></audio>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const S = { state: null, level: null, slots: [], slotId: null, detail: null, edit: null, dirty: false,
            cands: [], candTotal: 0, ceCache: {}, slotTerms: [], ceTerms: [] };
const LANG = { es: "Spanish(Mexico)", en: "English(US)", esES: "Spanish(Spain)" };

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
// Mirrors m4_app.fold(): letters/digits lower-cased without accents; other runs -> one space.
function foldMap(text) {
  const out = [], idx = []; let space = true;
  const chars = Array.from(String(text ?? ""));
  let pos = 0;
  for (const ch of chars) {
    const base = ch.normalize("NFKD").replace(/\p{M}/gu, "").toLowerCase();
    if (base && /^[\p{L}\p{N}]+$/u.test(base)) { for (const b of base) { out.push(b); idx.push([pos, pos + ch.length]); } space = false; }
    else if (!space) { out.push(" "); idx.push([pos, pos + ch.length]); space = true; }
    pos += ch.length;
  }
  return { s: out.join(""), idx };
}
// Escaped HTML of `text` with every search term wrapped in <mark>. Display only; never filters or ranks.
function hl(text, terms) {
  text = String(text ?? "");
  if (!terms || !terms.length || !text) return esc(text);
  const { s, idx } = foldMap(text); const ranges = [];
  for (const t of terms) {
    let i = s.indexOf(t);
    while (t && i >= 0) { ranges.push([idx[i][0], idx[i + t.length - 1][1]]); i = s.indexOf(t, i + 1); }
  }
  if (!ranges.length) return esc(text);
  ranges.sort((a, b) => a[0] - b[0]);
  const merged = [ranges[0]];
  for (const r of ranges.slice(1)) { const m = merged[merged.length - 1]; if (r[0] <= m[1]) m[1] = Math.max(m[1], r[1]); else merged.push(r); }
  let html = "", at = 0;
  for (const [a, b] of merged) { html += esc(text.slice(at, a)) + "<mark>" + esc(text.slice(a, b)) + "</mark>"; at = b; }
  return html + esc(text.slice(at));
}
function fmt(d) { return d == null ? "?" : d.toFixed(2) + " s"; }
function toast(text, kind) {
  const m = $("msg"); m.textContent = text; m.className = kind || ""; m.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = "none", kind === "err" ? 9000 : 3500);
}
async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) { const e = new Error(j.error || r.statusText); e.status = r.status; e.details = j.details || []; throw e; }
  return j;
}
function showErr(e) { toast((e.status ? e.status + ": " : "") + e.message + (e.details && e.details.length ? "\n- " + e.details.join("\n- ") : ""), "err"); }

// ---------------------------------------------------------------- audio
const player = $("player");
function play(url, btn) {
  stopEd();
  if (btn) { btn.disabled = true; btn.dataset.label = btn.dataset.label || btn.textContent; btn.textContent = "…"; }
  player.src = url;
  player.play().catch(err => toast("audio: " + (err.message || err) + " (decode may have failed; see server log)", "err"))
    .finally(() => { if (btn) { btn.disabled = false; btn.textContent = btn.dataset.label; } });
}
player.addEventListener("error", () => toast("audio could not be loaded (decode failed or source missing)", "err"));
const mccUrl = (level, lang, index) => `/audio/mcc?level=${encodeURIComponent(level)}&lang=${lang}&index=${index}`;
const ceUrl = (ref, lang) => `/audio/ce?ref=${encodeURIComponent(ref)}&lang=${encodeURIComponent(lang)}`;

// ---------------------------------------------------------------- state / levels
async function loadState(keepLevel) {
  S.state = await api("/api/state");
  const sel = $("level"); const prev = keepLevel || sel.value;
  sel.innerHTML = "";
  for (const group of ["campaign", "cutscene", "generic"]) {
    const og = document.createElement("optgroup"); og.label = group;
    for (const l of S.state.levels.filter(x => x.group === group)) {
      const p = l.progress, st = l.status ? " · " + l.status.status.replace(/_/g, " ") : "";
      const o = new Option(`${l.level} — ${p.decided}/${p.slots} decided${st}`, l.level);
      og.appendChild(o);
    }
    sel.appendChild(og);
  }
  sel.value = prev && S.state.levels.some(l => l.level === prev) ? prev : (S.state.levels[0] || {}).level;
  S.level = sel.value;
  renderProgress(); renderFooter(S.state.validation);
  const cs = $("cscope"), prevScope = cs.value;
  cs.innerHTML = "";
  const lvl = curLevel();
  if (lvl && lvl.ce_missions.length) cs.appendChild(new Option(`mapped for ${lvl.level}: ${lvl.ce_missions.join(", ")}`, "mapped"));
  cs.appendChild(new Option("all missions", "all"));
  for (const m of S.state.missions) cs.appendChild(new Option(`${m.mission} (${m.lines} lines)`, m.mission));
  cs.value = [...cs.options].some(o => o.value === prevScope) && keepLevel ? prevScope : defaultScope();
}
const curLevel = () => S.state.levels.find(l => l.level === S.level);
// Default CE scope: the mapped missions; for MCC's generic bark folders (marines, grunt, ...) the CE
// systemic voice sets (SYS), when catalogued; otherwise all missions. A default filter only, never a match.
function defaultScope() {
  const cs = $("cscope"), l = curLevel();
  if (l && !l.ce_missions.length && l.group === "generic" && [...cs.options].some(o => o.value === "SYS")) return "SYS";
  return cs.options[0].value;
}
function renderProgress() {
  const l = curLevel(); if (!l) return;
  const p = l.progress, n = Math.max(1, p.slots);
  $("pbar").innerHTML = `<span style="width:${100 * p.audio_approved / n}%;background:var(--ok)"></span>` +
    `<span style="width:${100 * Math.max(0, p.decided - p.audio_approved) / n}%;background:var(--accent)"></span>`;
  $("ptext").textContent = `${p.decided}/${p.slots} decided · audio ✔ ${p.audio_approved} · subtitle ✔ ${p.subtitle_approved}` +
    (p.needs_rework ? ` · rework ${p.needs_rework}` : "");
  $("lstatus").value = l.status ? l.status.status : "";
}
function renderFooter(v) {
  if (!v) { $("foot").textContent = "validator: running…"; return; }
  const s = v.summary, sev = s.by_severity || {};
  const bits = [`validator: ${sev.error || 0} error(s), ${sev.warning || 0} warning(s), drift ${v.drift_entries}`,
                `catalogs: ${s.catalog_records.mcc} MCC tags, ${s.catalog_records.ce} CE records`, `mappings ${s.mappings}`];
  $("foot").innerHTML = bits.map(esc).join(" · ") + (v.findings.length ? " · " + v.findings.slice(0, 3).map(f => `<span title="${esc(f.message)}">[${esc(f.severity)}] ${esc(f.code)}</span>`).join(" ") : "");
}

// ---------------------------------------------------------------- slots
async function loadSlots() {
  const all = $("sall").checked;
  const q = new URLSearchParams({ level: all ? "all" : S.level, status: $("sfilter").value, q: $("sq").value });
  const r = await api("/api/slots?" + q);
  S.slots = r.slots; S.slotTerms = r.terms || [];
  $("scount").textContent = `${r.total} slot(s)${all ? " in all levels" : ""}${r.truncated ? `, first ${r.slots.length} shown` : ""} · catalog order`;
  const ul = $("slots"); ul.innerHTML = "";
  for (const s of r.slots) {
    const li = document.createElement("li"); li.dataset.id = s.slot_id;
    const d = s.decision;
    const label = s.tag_name + (s.permutations > 1 ? ` #${s.ordinal}` : "");
    li.innerHTML = `<span class="dot ${d ? d.match : ""}" title="${d ? d.match : "unreviewed"}"></span>` +
      (all ? `<span class="badge">${esc(s.level)}</span>` : "") +
      `<span class="grow mono" title="${esc(s.slot_id)}">${hl(label, S.slotTerms)}</span>` +
      (s.radio_effect ? `<span class="badge radio" title="needs radio effect (v1.1)">R</span>` : "") +
      (s.different_but_fits ? `<span class="badge fits" title="different dialogue, but fits the scene">≈</span>` : "") +
      (s.edited ? `<span class="badge edited" title="audio edit recipe (trim, cuts, silences, fades)">E</span>` : "") +
      (d && d.audio === "approved" ? `<span class="badge approved" title="audio approved">A</span>` : d && d.audio === "needs_rework" ? `<span class="badge needs_rework">A</span>` : "") +
      (d && d.subtitle === "approved" ? `<span class="badge approved" title="subtitle approved">S</span>` : d && d.subtitle === "needs_rework" ? `<span class="badge needs_rework">S</span>` : "") +
      `<span class="small muted">${s.duration_s == null ? "" : s.duration_s.toFixed(1) + "s"}</span>` +
      (s.channels > 1 ? `<span class="badge warn" title="stereo slot: playable; stereo replacement not implemented yet">stereo</span>` : "") +
      (s.texts ? snippet(s.texts, S.slotTerms) : "");
    li.onclick = () => selectSlot(s.slot_id);
    if (s.slot_id === S.slotId) li.classList.add("sel");
    ul.appendChild(li);
  }
}
function snippet(texts, terms) {
  for (const t of ["SU", "SP", "EN"]) {
    const v = texts[t]; if (!v) continue;
    const html = hl(v, terms);
    if (html.includes("<mark>")) return `<span class="snip"><b>${t}</b> ${html}</span>`;
  }
  return "";
}
function markSel() { for (const li of $("slots").children) li.classList.toggle("sel", li.dataset.id === S.slotId); }
async function selectSlot(id, force) {
  if (!force && S.dirty && id !== S.slotId && !confirm("Discard unsaved edits on this slot?")) return;
  S.slotId = id; markSel();
  history.replaceState(null, "", "#" + new URLSearchParams({ level: S.level, slot: id }));
  const li = [...$("slots").children].find(x => x.dataset.id === id); if (li) li.scrollIntoView({ block: "nearest" });
  try {
    S.detail = await api("/api/slot?id=" + encodeURIComponent(id));
  } catch (e) { showErr(e); return; }
  const m = S.detail.mapping;
  S.edit = {
    match: { status: m ? m.match.status : "unreviewed", ce_line_refs: m ? [...m.match.ce_line_refs] : [] },
    audio: { source: m ? m.audio.source : "keep_original", language: m && m.audio.sources[0] ? m.audio.sources[0].language : LANG.es,
             edit: editFrom(m && m.audio.edit) },
    subtitle: { source: m ? m.subtitle.source : "keep_original",
                ref: m && m.subtitle.ce_locres ? m.subtitle.ce_locres.ce_line_ref : null,
                culture: m && m.subtitle.ce_locres ? m.subtitle.ce_locres.culture : "es-MX",
                custom_text: S.detail.custom_text || "" },
    notes: m ? m.notes : "",
    radio: m ? m.radio_effect.needed : false,
    fits: !!(m && m.different_but_fits && m.different_but_fits.marked),
  };
  for (const l of S.detail.matched_lines) S.ceCache[l.ce_line_ref] = l;
  S.dirty = false;
  renderDetail();
  if ($("chide").checked) await loadCands(); else renderCands();  // the hidden set depends on slot + saved matches
}
function moveSlot(step) {
  if (!S.slots.length) return;
  const i = S.slots.findIndex(s => s.slot_id === S.slotId);
  const j = Math.min(S.slots.length - 1, Math.max(0, (i < 0 ? -1 : i) + step));
  selectSlot(S.slots[j].slot_id);
}

// ---------------------------------------------------------------- detail
function statusBadge(o) {
  if (!o) return `<span class="badge">undecided · new</span>`;
  const label = o.status === "draft" ? "undecided (draft)" : o.status.replace("_", " ");
  return `<span class="badge ${o.status}">${label} · rev ${o.revision}</span>`;
}
function ceDur(ref, lang) { const l = S.ceCache[ref]; return l && l.media[lang] ? l.media[lang].duration_s : null; }
function audioSources() {
  const e = S.edit;
  if (e.audio.source === "keep_original") return [];
  return e.match.ce_line_refs.map(r => ({ kind: "ce", ce_line_ref: r, language: e.audio.language }));

  // waveform: drag a trim handle (unlocked), drag to select, click to play from there
  const cv = $("wvSrc");
  cv.onmousedown = (ev) => {
    if (!S.ed.srcBuf) return;
    const t = edTimeAt(ev), d = S.ed.srcBuf.duration, px = 8 / cv.clientWidth * d;
    let mode = "sel";
    if (!locked && Math.abs(t - e.trim_start_s) < px) mode = "ts";
    else if (!locked && Math.abs(t - (d - e.trim_end_s)) < px) mode = "te";
    S.ed.drag = { mode, t0: t, moved: false };
    const move = (mv) => {
      const t1 = edTimeAt(mv), dr = S.ed.drag; if (!dr) return;
      if (Math.abs(t1 - dr.t0) > 0.004) dr.moved = true;
      if (dr.mode === "ts") e.trim_start_s = r3(Math.min(t1, d - e.trim_end_s - 0.05));
      else if (dr.mode === "te") e.trim_end_s = r3(Math.max(0, Math.min(d - t1, d - e.trim_start_s - 0.05)));
      else if (dr.moved) { S.ed.sel = [r3(Math.min(dr.t0, t1)), r3(Math.max(dr.t0, t1))]; $("edSel").textContent = `selection ${S.ed.sel[0].toFixed(3)}–${S.ed.sel[1].toFixed(3)} s (${(S.ed.sel[1] - S.ed.sel[0]).toFixed(3)} s)`; }
      if (dr.mode !== "sel") fillEditorInputs();
      drawEditor();
    };
    const up = (uv) => {
      window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up);
      const dr = S.ed.drag; S.ed.drag = null; if (!dr) return;
      if (dr.mode !== "sel") {
        if (dr.mode === "ts" && e.trim_start_s && !e.fade_in_ms) e.fade_in_ms = 10;
        if (dr.mode === "te" && e.trim_end_s && !e.fade_out_ms) e.fade_out_ms = 10;
        e.cuts = e.cuts.filter(c => c.start_s >= e.trim_start_s && c.end_s <= d - e.trim_end_s);
        e.silences = e.silences.filter(x => x.at_s >= e.trim_start_s && x.at_s <= d - e.trim_end_s);
        edChanged(true);
      } else if (!dr.moved) {
        S.ed.cursor = r3(edTimeAt(uv)); S.ed.sel = null; $("edSel").textContent = `cursor ${S.ed.cursor.toFixed(3)} s`;
        edPlayOriginal(S.ed.cursor);
      }
    };
    window.addEventListener("mousemove", move); window.addEventListener("mouseup", up);
    ev.preventDefault();
  };
  cv.onmousemove = (ev) => {
    if (!S.ed.srcBuf || S.ed.drag || locked) return;
    const t = edTimeAt(ev), d = S.ed.srcBuf.duration, px = 8 / cv.clientWidth * d;
    cv.style.cursor = Math.abs(t - e.trim_start_s) < px || Math.abs(t - (d - e.trim_end_s)) < px ? "ew-resize" : "crosshair";
  };
}
window.addEventListener("resize", () => drawEditor());

// ---------------------------------------------------------------- CE candidates
async function loadCands(append) {
  const offset = append ? S.cands.length : 0;
  const q = new URLSearchParams({ mission: $("cscope").value, level: (S.detail && S.detail.level) || S.level,
                                  q: $("cq").value, subs: $("csubs").value, offset, limit: 60,
                                  hide_used: $("chide").checked ? "1" : "", keep_slot: S.slotId || "" });
  let r;
  try { r = await api("/api/ce?" + q); } catch (e) { showErr(e); return; }
  S.cands = append ? S.cands.concat(r.lines) : r.lines;
  S.candTotal = r.total; S.ceTerms = r.terms || []; S.ceHidden = r.hidden_used || 0;
  for (const l of r.lines) S.ceCache[l.ce_line_ref] = l;
  renderCands();
}
function renderCands() {
  const chosen = new Set(S.edit ? S.edit.match.ce_line_refs : []);
  const aLocked = S.detail && S.detail.mapping && S.detail.mapping.audio.status === "approved";
  $("ccount").textContent = `${S.cands.length} of ${S.candTotal} line(s), catalog order (never ranked)` +
    (S.ceHidden ? ` · ${S.ceHidden} already used hidden` : "");
  $("cmore").style.display = S.cands.length < S.candTotal ? "" : "none";
  $("cands").innerHTML = S.cands.map((l, i) => {
    const t = (c) => l.subtitles[c].text ? hl(l.subtitles[c].text, S.ceTerms) : `<i class="muted">no ${c} subtitle (${esc(l.subtitles[c].reason || l.subtitles[c].evidence || "none")})</i>`;
    const pb = (lang, label) => l.media[lang].count ? `<button class="play" data-play="${esc(ceUrl(l.ce_line_ref, lang))}">▶ ${label} ${l.media[lang].duration_s == null ? "" : fmt(l.media[lang].duration_s)}</button>` : `<span class="badge" title="${esc(l.media[lang].reason || "")}">no ${label}</span>`;
    return `<div class="cand ${chosen.has(l.ce_line_ref) ? "chosen" : ""}">
      <div class="head"><span class="num">${i < 9 ? i + 1 : ""}</span><span class="mono grow" title="${esc(l.ce_line_ref)}">${hl(l.display_key, S.ceTerms)}${l.entries_in_record > 1 ? " #" + l.entry_index : ""}</span>
        ${l.subtitles["es-MX"].text ? "" : '<span class="badge warn" title="no es-MX source subtitle found; you can still play and use it, and write a custom subtitle">no subtitle</span>'}
        <span class="badge">${esc(l.mission)} · ${esc(l.family)}</span>
        ${l.test_event ? '<span class="badge" title="test event: no dialogue media">test</span>' : ""}
        ${l.used_by.length ? `<span class="badge ${l.used_by.some(x => x !== S.slotId) ? "warn" : ""}" title="already in the match of: ${esc(l.used_by.join(", "))}">used ×${l.used_by.length}</span>` : ""}
        ${l.verifications.length ? `<span class="badge" title="past checks">${l.verifications.map(esc).join(" ")}</span>` : ""}</div>
      <div class="row">${pb(LANG.es, "es-MX")} ${pb(LANG.en, "en")}
        <button data-use="${esc(l.ce_line_ref)}" ${!S.edit || chosen.has(l.ce_line_ref) || l.test_event || aLocked ? "disabled" : ""}>+ use for this slot</button></div>
      <div class="text small"><b>es-MX</b>${t("es-MX")}</div>
      <div class="text small"><b>en</b>${t("en")}</div>
      <details><summary>es-ES text and audio</summary><div class="text small"><b>es-ES</b>${t("es-ES")}</div>${pb(LANG.esES, "es-ES")}</details>
    </div>`;
  }).join("");
  document.querySelectorAll('#cands [data-play]').forEach(b => b.onclick = () => play(b.dataset.play, b));
  document.querySelectorAll('#cands [data-use]').forEach(b => b.onclick = () => {
    const e = S.edit; e.match.ce_line_refs.push(b.dataset.use);
    if (e.match.status === "unreviewed" || e.match.status === "no_equivalent") e.match.status = "matched";
    applyCeDefaults();
    setDirty(); renderDetail(); renderCands();
  });
}

// ---------------------------------------------------------------- level status
$("lstatusSave").onclick = async () => {
  const st = $("lstatus").value; if (!st) return;
  const confirmIt = st === "in_game_tested" || st === "reviewed";
  let note = "", verification = null;
  if (confirmIt) {
    if (!confirm(`Mark ${S.level} as “${st.replace(/_/g, " ")}”? Only do this after the level was built and checked in MCC.`)) return;
    verification = prompt("verifications.json entry for the in-game test (e.g. v-000020), or leave empty:", "") || null;
    note = prompt("Note (optional):", "") || "";
  }
  try {
    const r = await api("/api/progress", { level: S.level, status: st, note, verification, confirm: confirmIt, loaded_sha256: S.state.sha256.progress });
    toast(`${S.level}: ${st.replace(/_/g, " ")}`, "ok"); if (r.validation) renderFooter(r.validation);
    await loadState(S.level);
  } catch (e) { showErr(e); renderProgress(); }
};

// ---------------------------------------------------------------- events
let tS, tC;
$("level").onchange = async () => {
  if (S.dirty && !confirm("Discard unsaved edits on this slot?")) { $("level").value = S.level; return; }
  S.level = $("level").value; S.slotId = null; S.detail = null; S.edit = null; S.dirty = false;
  $("detail").className = "muted"; $("detail").textContent = "Pick a slot on the left.";
  await loadState(S.level); $("cscope").value = defaultScope(); await loadSlots(); await loadCands();
};
$("sfilter").onchange = loadSlots;
$("sall").onchange = loadSlots;
$("csubs").onchange = () => loadCands();
try { $("chide").checked = localStorage.getItem("m4.hideUsed") === "1"; } catch (_) {}
$("chide").onchange = () => { try { localStorage.setItem("m4.hideUsed", $("chide").checked ? "1" : ""); } catch (_) {} loadCands(); };
$("sq").oninput = () => { clearTimeout(tS); tS = setTimeout(loadSlots, 250); };
$("cscope").onchange = () => loadCands();
$("cq").oninput = () => { clearTimeout(tC); tC = setTimeout(() => loadCands(), 250); };
$("cmore").onclick = () => loadCands(true);
window.addEventListener("beforeunload", (ev) => { if (S.dirty) { ev.preventDefault(); ev.returnValue = ""; } });
document.addEventListener("keydown", (ev) => {
  const tag = (ev.target.tagName || "").toLowerCase();
  if (["input", "textarea", "select"].includes(tag) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === "j" || ev.key === "J") { moveSlot(1); ev.preventDefault(); }
  else if (ev.key === "k" || ev.key === "K") { moveSlot(-1); ev.preventDefault(); }
  else if (ev.key === " ") { const b = $("playSpain"); if (b) { play(b.dataset.play, b); ev.preventDefault(); } }
  else if (ev.key === "o" || ev.key === "O") { if (edPlayOriginal()) ev.preventDefault(); }
  else if (ev.key === "e" || ev.key === "E") { if (edPlayEdited("encoded")) ev.preventDefault(); }
  else if (ev.key === "Escape") { stopEd(); player.pause(); }
  else if (/^[1-9]$/.test(ev.key)) { const l = S.cands[+ev.key - 1]; if (l && l.media[LANG.es].count) play(ceUrl(l.ce_line_ref, LANG.es)); }
});

(async () => {
  const h = new URLSearchParams(location.hash.slice(1));
  try { await loadState(h.get("level")); await loadSlots(); await loadCands(); if (h.get("slot")) await selectSlot(h.get("slot")); }
  catch (e) { showErr(e); }
  setTimeout(async () => { try { const s = await api("/api/state"); renderFooter(s.validation); } catch (_) {} }, 4000);
})();
</script>
